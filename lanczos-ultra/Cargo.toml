[package]
name = "lanczos-ultra"
version = "0.2.0"
edition = "2024"
description = "Antialiased Lanczos resampling with Rust and C APIs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["cli"]
cli = ["dep:image", "dep:clap"]

[[bin]]
name = "lanczos-ultra"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
image = { version = "0.25.9", optional = true }
clap = { version = "4.5.54", features = ["derive"], optional = true }
rayon = "1.11"
rustfft = "6.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
